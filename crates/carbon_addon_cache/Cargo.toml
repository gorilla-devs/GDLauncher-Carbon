[package]
name = "carbon_addon_cache"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.5"
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
twox-hash = "1.6"
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "0.6", features = ["deflate"] }
image = "0.24"
reqwest = { version = "0.11", features = ["json"] }
crossbeam-channel = "0.5"
tokio-stream = "0.1"
parking_lot = "0.12"
num_cpus = "1.16"
toml = "0.8"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }
carbon_scheduler = { workspace = true }
hex = "0.4"
murmurhash32 = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"
tokio-test = "0.4"
assert2 = "0.3"
tracing-test = "0.2"