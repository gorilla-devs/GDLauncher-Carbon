name: All OS

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  mac_universal:
    defaults:
      run:
        working-directory: ./GDL
    runs-on: macos-15
    timeout-minutes: 160
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v3
        with:
          path: GDL
      - uses: actions/setup-node@v3
        with:
          node-version: "24.14.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - name: Prepare
        run: |
          echo "" > crates/carbon_repos/src/db.rs
          cargo fmt --check
      - run: |
          npm run sudo-init
          chmod -R a+x node_modules
      - name: Iridium patchfix
        run: node iridium_patchfix.js
      - name: Build
        run: pnpm build:mac-universal
        env:
          GDL_E2E: "1"
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: Clear target before tests to avoid folder getting too big
        run: rm -rf target
      - name: Test
        env:
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          E2E_INTERNAL_AUTH_TOKEN: ${{ secrets.E2E_INTERNAL_AUTH_TOKEN }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          RUNTIME_PATH: ${{ vars.RUNTIME_PATH }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
          # GitHub's Mac runners have no GPU, so Minecraft can't open its
          # window there. The tests that need the window skip and say why.
          E2E_NO_OPENGL: "1"
          # The same fact for the game log reader, which then skips a launch whose
          # log names no OpenGL driver (e2e-tests/helpers/gameLog.ts).
          GDL_E2E_NO_OPENGL: "1"
        run: pnpm test:all
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-macos
          path: ./GDL/apps/desktop/playwright-report/
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: ./GDL/apps/desktop/test-results/
      - name: Upload e2e debug logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos
          path: ./GDL/apps/desktop/test-results/e2e-logs/**/*.log
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
  ubuntu_x64:
    defaults:
      run:
        working-directory: ./GDL
    runs-on: ubuntu-22.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v3
        with:
          path: GDL
      - uses: actions/setup-node@v3
        with:
          node-version: "24.14.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
      - name: Prepare
        run: |
          echo "" > crates/carbon_repos/src/db.rs
          cargo fmt --check
      - run: |
          npm run sudo-init
          chmod -R a+x node_modules
      - name: Iridium patchfix
        run: node iridium_patchfix.js
      - name: Build
        run: pnpm build:linux-x64
        env:
          GDL_E2E: "1"
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: Clear target before tests to avoid folder getting too big
        run: rm -rf target
      - name: Test
        env:
          DISPLAY: ":1"
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          E2E_INTERNAL_AUTH_TOKEN: ${{ secrets.E2E_INTERNAL_AUTH_TOKEN }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          RUNTIME_PATH: ${{ vars.RUNTIME_PATH }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
          # Games get software OpenGL on Xvfb here, so a log naming no OpenGL driver
          # fails the test instead of skipping it (e2e-tests/helpers/gameLog.ts).
          GDL_E2E_REQUIRE_OPENGL: "1"
        run: |
          sudo apt-get install -y xvfb
          /usr/bin/Xvfb :1 -screen 0 1920x1080x24 &
          export DISPLAY=:1
          sleep 5
          ps aux | grep Xvfb
          ls -l /tmp/.X11-unix/
          echo "DISPLAY=$DISPLAY"
          pnpm test:all
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./GDL/apps/desktop/playwright-report/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: ./GDL/apps/desktop/test-results/
      - name: Upload e2e debug logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux
          path: ./GDL/apps/desktop/test-results/e2e-logs/**/*.log
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
  windows_x64:
    defaults:
      run:
        working-directory: ./GDL
    runs-on: windows-2022
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v3
        with:
          path: GDL
      - uses: actions/setup-node@v3
        with:
          node-version: "24.14.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - name: Install scoop and llvm
        run: |
          Invoke-Expression (New-Object System.Net.WebClient).DownloadString('https://get.scoop.sh')
          scoop install llvm
      - name: Prepare
        shell: bash
        run: |
          echo "" > crates/carbon_repos/src/db.rs
          cargo fmt --check
      - name: init
        shell: bash
        run: npm run init
      - name: Iridium patchfix
        shell: bash
        run: node iridium_patchfix.js
      - name: Build
        shell: bash
        run: pnpm build:win-x64
        env:
          OW_BUILD_KEY: ${{ secrets.OW_BUILD_KEY }}
          OW_CLI_EMAIL: ${{ secrets.OW_CLI_EMAIL }}
          OW_CLI_API_KEY: ${{ secrets.OW_CLI_API_KEY }}
          GDL_E2E: "1"
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: pnpm lint
      - name: Clear target before tests to avoid folder getting too big
        shell: bash
        run: rm -rf target
      # The runner has no graphics driver, so Windows offers no OpenGL and
      # Minecraft can't open its window ("WGL: The driver does not appear to
      # support OpenGL"). Mesa's software renderer gives it one, as Xvfb's
      # Mesa does on Linux.
      - name: Install a software OpenGL driver
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $version = "26.0.3"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($hash -ne "DE1EC45C906164DE2C046288A8969E83CF2D51D031DC8DFD1F9371BB31CD6755") { throw "unexpected Mesa archive: $hash" }
          7z x mesa.7z -omesa | Out-Null
          Set-Location mesa
          .\systemwidedeploy.cmd 1
      # The step above only runs Mesa's deploy script. If the driver did not land,
      # stop here with that cause rather than later as failed game launches.
      - name: Check the Mesa OpenGL driver is registered
        shell: pwsh
        run: |
          $icd = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL'
          $dll = "$env:WINDIR\System32\mesadrv.dll"
          if (-not (Test-Path -LiteralPath $icd)) { throw "Mesa is not registered as the OpenGL driver: $icd is missing" }
          if (-not (Test-Path -LiteralPath $dll)) { throw "Mesa's OpenGL driver is missing: $dll" }
          Get-ItemProperty -LiteralPath $icd
          Get-Item -LiteralPath $dll
      - name: Test
        shell: bash
        env:
          CARGO_INCREMENTAL: 0
          BASE_API: ${{ vars.BASE_API }}
          TEST_BASE_API: ${{ vars.TEST_BASE_API }}
          E2E_INTERNAL_AUTH_TOKEN: ${{ secrets.E2E_INTERNAL_AUTH_TOKEN }}
          MS_AUTH_CLIENT_ID: ${{ vars.MS_AUTH_CLIENT_ID }}
          RUNTIME_PATH: ${{ vars.RUNTIME_PATH }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          USER_AGENT_PREFIX: ${{ vars.USER_AGENT_PREFIX }}
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          # Mesa would pick GL-on-D3D12 over WARP; llvmpipe is what Linux games already run on.
          GALLIUM_DRIVER: llvmpipe
          # Mesa above gives games OpenGL, so a log naming no OpenGL driver fails the
          # test instead of skipping it (e2e-tests/helpers/gameLog.ts).
          GDL_E2E_REQUIRE_OPENGL: "1"
        run: pnpm test:all
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-win
          path: ./GDL/apps/desktop/playwright-report/
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: ./GDL/apps/desktop/test-results/
      - name: Upload e2e debug logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: ./GDL/apps/desktop/test-results/e2e-logs/**/*.log
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
