<!doctype html>
<html lang="en" style="margin: 0; padding: 0; background: #1e2129">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/gdlauncher_logo.svg"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
       script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.gdl.gg;
       worker-src 'self' blob:;
       img-src 'self' data: https: blob: http://127.0.0.1:* http://localhost:* http://i.imgur.com;
       font-src 'self' http://127.0.0.1:*;
       media-src 'self' https://*.gdl.gg http://127.0.0.1:*;
       default-src 'unsafe-inline' 'self';
       frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://i.imgur.com https://cdn.ko-fi.com;
       connect-src 'self' data: ws://127.0.0.1:* https://www.minecraft.net https://launchercontent.mojang.com http://127.0.0.1:* https://unpkg.com/@rive-app/canvas@2.35.0/rive.wasm https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.35.0/rive_fallback.wasm https://*.gdl.gg;
     "
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html[data-gdl-background] body {
        background: transparent !important;
      }
      /* The theme's layout menu (themes/layout.ts). (0,2,1) beats the utility
         classes; theme CSS comes later, so a selector of the same weight
         (html[data-gdl-panels="off"] [data-gdl~="panel"]) still wins. The
         News tab bar is a sticky bar, so it keeps its colour (the :where
         adds no weight). */
      html[data-gdl-panels="off"]
        :is(
          [data-gdl~="panel-frame"],
          [data-gdl~="panel"],
          [data-gdl~="page"],
          [data-gdl~="page.body"]:not(:where([data-gdl~="news.tabs"]))
        ) {
        background-color: transparent;
        background-image: none;
        border-color: transparent;
        box-shadow: none;
      }
      /* Under the cleared panels, with no background picture, the page is the
         theme's panel colour rather than the window's boot colour (the inline
         #1e2129, which only main matches). */
      html[data-gdl-panels="off"]:not([data-gdl-background]) body {
        background: rgb(var(--darkSlate-800)) !important;
      }
      /* The caption tiles' colours and the panel frame under a background
         picture are in src/themes/controls.css. */
      @font-face {
        font-family: "Ubuntu";
        font-style: normal;
        font-weight: 300;
        src:
          local("Ubuntu"),
          url("/assets/fonts/ubuntu-light-webfont.woff2") format("woff2");
      }
      @font-face {
        font-family: "Ubuntu";
        font-style: normal;
        font-weight: 400;
        src:
          local("Ubuntu"),
          url("/assets/fonts/ubuntu-regular-webfont.woff2") format("woff2");
      }
      @font-face {
        font-family: "Ubuntu";
        font-style: normal;
        font-weight: 500;
        src:
          local("Ubuntu"),
          url("/assets/fonts/ubuntu-medium-webfont.woff2") format("woff2");
      }
      @font-face {
        font-family: "Ubuntu";
        font-style: normal;
        font-weight: 600;
        src:
          local("Ubuntu"),
          url("/assets/fonts/ubuntu-bold-webfont.woff2") format("woff2");
      }

      @font-face {
        font-family: "Ubuntu Mono";
        font-style: normal;
        font-weight: 400;
        src:
          local("Ubuntu Mono"),
          url("/assets/fonts/UbuntuMono-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Ubuntu Mono";
        font-style: normal;
        font-weight: 500;
        src:
          local("Ubuntu Mono"),
          url("/assets/fonts/UbuntuMono-Bold.ttf") format("truetype");
      }

      @font-face {
        font-family: "Monocraft";
        font-style: normal;
        font-weight: 300;
        src:
          local("Monocraft"),
          url("/assets/fonts/monocraft-light.ttf") format("truetype");
      }

      @font-face {
        font-family: "Monocraft";
        font-style: normal;
        font-weight: 400;
        src:
          local("Monocraft"),
          url("/assets/fonts/monocraft.ttf") format("truetype");
      }

      @font-face {
        font-family: "Monocraft";
        font-style: normal;
        font-weight: 500;
        src:
          local("Monocraft"),
          url("/assets/fonts/monocraft-semibold.ttf") format("truetype");
      }

      @font-face {
        font-family: "Monocraft";
        font-style: normal;
        font-weight: 600;
        src:
          local("Monocraft"),
          url("/assets/fonts/monocraft-bold.ttf") format("truetype");
      }

      * {
        font-family: var(--font);
        font-synthesis: none;
      }

      /* View transition classes */

      @keyframes slide-out-to-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes slide-in-from-right {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      @keyframes slide-out-to-right {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(100%);
        }
      }

      @keyframes slide-in-from-left {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* Base transitions for all view transitions */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 250ms;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        animation-fill-mode: both;
        will-change: transform;
        contain: paint;
      }

      .disable-view-transition {
        view-transition-name: disable-view-transition;
      }

      ::view-transition-old(disable-view-transition),
      ::view-transition-new(disable-view-transition) {
        animation-duration: 0s;
      }

      /* What slides (classes on <html>, NavigationManager/pageSlide.ts): the
         page's panel, so its frame and frosted glass stay put and live behind
         it (a backdrop-filter inside a transition snapshot has nothing to
         blur); the page box when a page has no panel; the body outside the
         app's layout. */
      html.slide-right-transition #gdl-content-wrapper,
      html.slide-right-transition #gdl-page:not(:has(#gdl-content-wrapper)),
      html.slide-right-transition body:not(:has(#gdl-page)) {
        view-transition-name: slide-right-transition;
      }

      html.slide-left-transition #gdl-content-wrapper,
      html.slide-left-transition #gdl-page:not(:has(#gdl-content-wrapper)),
      html.slide-left-transition body:not(:has(#gdl-page)) {
        view-transition-name: slide-left-transition;
      }

      ::view-transition-old(slide-right-transition),
      ::view-transition-new(slide-right-transition) {
        animation-duration: 250ms;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        animation-fill-mode: both;
        will-change: transform;
        contain: paint;
      }

      ::view-transition-old(slide-left-transition),
      ::view-transition-new(slide-left-transition) {
        animation-duration: 250ms;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        animation-fill-mode: both;
        will-change: transform;
        contain: paint;
      }

      /* The page slides inside its own box (see NavigationManager). */
      ::view-transition-group(slide-right-transition),
      ::view-transition-group(slide-left-transition) {
        overflow: clip;
      }

      /* While only the page slides, the rest of the window doesn't
         cross-fade: the live view shows, so a theme's snow keeps falling. */
      html.gdl-page-slide::view-transition-old(root) {
        animation: none;
        opacity: 0;
      }
      html.gdl-page-slide::view-transition-new(root) {
        animation: none;
      }

      /* The snow, the lights and the content's decorations sit above the
         page. In a view transition the root's view falls behind whatever
         moves, so in every transition they keep their own place, live and
         still; the panel's decorations (the ledge) too while its contents
         slide or switch (the library's Instances and Servers). */
      [data-gdl-effects] {
        view-transition-name: gdl-effects;
      }
      [data-gdl-decorations="content"] {
        view-transition-name: gdl-content-decorations;
      }
      html.gdl-page-slide [data-gdl-decorations="panel"],
      html.gdl-library-switch [data-gdl-decorations="panel"] {
        view-transition-name: gdl-panel-decorations;
      }
      ::view-transition-old(gdl-effects),
      ::view-transition-old(gdl-content-decorations),
      ::view-transition-old(gdl-panel-decorations) {
        animation: none;
        opacity: 0;
      }
      ::view-transition-group(gdl-effects),
      ::view-transition-group(gdl-content-decorations),
      ::view-transition-group(gdl-panel-decorations),
      ::view-transition-new(gdl-effects),
      ::view-transition-new(gdl-content-decorations),
      ::view-transition-new(gdl-panel-decorations) {
        animation: none;
      }

      ::view-transition-old(slide-right-transition) {
        animation-name: slide-out-to-left;
      }

      ::view-transition-new(slide-right-transition) {
        animation-name: slide-in-from-right;
      }

      ::view-transition-old(slide-left-transition) {
        animation-name: slide-out-to-right;
      }

      ::view-transition-new(slide-left-transition) {
        animation-name: slide-in-from-left;
      }

      /* Folder expansion view transitions */
      /* Disable default crossfade - only the group morph should animate */
      ::view-transition-old(folder-tile) {
        animation: none;
        opacity: 0;
      }

      ::view-transition-new(folder-tile) {
        animation: none;
      }

      /* Control size/position morphing for folder tile */
      ::view-transition-group(folder-tile) {
        animation-duration: 200ms;
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        animation-fill-mode: both;
      }

      /* Folder preview image transitions */
      ::view-transition-old(folder-preview-0),
      ::view-transition-new(folder-preview-0),
      ::view-transition-old(folder-preview-1),
      ::view-transition-new(folder-preview-1),
      ::view-transition-old(folder-preview-2),
      ::view-transition-new(folder-preview-2),
      ::view-transition-old(folder-preview-3),
      ::view-transition-new(folder-preview-3) {
        animation-duration: 200ms;
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        animation-fill-mode: both;
      }

      /* Disable root transition to avoid full page morph during folder transitions */
      ::view-transition-group(root) {
        animation: none;
      }

      html,
      body {
        background: rgb(var(--darkSlate-800));
        color: white;
      }

      img {
        -webkit-user-drag: none;
      }

      #root {
        /* transform: translateY(100%);
        transition: transform 0.25s ease-out;
        will-change: transform; */
      }

      *:not(#instance_logs_container *):not(#server_console_container *) {
        user-select: none;
        cursor: default;
      }

      #instance_logs_container *,
      #server_console_container * {
        user-select: text;
        cursor: auto;
      }

      *[data-cursor-pointer] {
        cursor: pointer !important;
      }

      input {
        cursor: text !important;
      }

      .instance-tile-spinning {
        background-image:
          linear-gradient(to right, transparent, transparent),
          conic-gradient(
            from var(--instance-tile-angle),
            rgb(var(--primary)) 0deg 90deg,
            transparent 90deg 180deg,
            transparent 180deg 270deg,
            transparent 270deg 360deg
          );
        background-origin: border-box;
        background-clip: padding-box, border-box;
      }

      @keyframes rotate {
        to {
          --instance-tile-angle: 360deg;
        }
      }

      .instance-tile-spinning {
        animation: rotate 4s linear infinite;
      }

      @property --instance-tile-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      @keyframes pulse-new-instance {
        0%,
        100% {
          outline-color: rgb(var(--primary-500));
        }
        50% {
          outline-color: transparent;
        }
      }

      .instance-tile-new {
        outline: 2px solid rgb(var(--primary-500));
        outline-offset: 0px;
        border-radius: 1rem;
        animation: pulse-new-instance 1.5s ease-in-out infinite;
      }

      /* Selection border drawing animation */
      @keyframes draw-selection-border {
        from {
          stroke-dashoffset: var(--border-perimeter);
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes undraw-selection-border {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: var(--border-perimeter);
        }
      }

      .selection-border-draw {
        stroke-dasharray: var(--border-perimeter);
        stroke-dashoffset: var(--border-perimeter);
        animation: draw-selection-border 0.15s ease-out forwards;
      }

      .selection-border-undraw {
        stroke-dasharray: var(--border-perimeter);
        stroke-dashoffset: 0;
        animation: undraw-selection-border 0.1s ease-in forwards;
      }

      /* With reduced motion no animation runs (.potato-pc), so the outline
         is drawn whole at once instead of staying undrawn. */
      .potato-pc .selection-border-draw {
        stroke-dashoffset: 0;
      }

      .appFatalCrash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgb(var(--darkSlate-800));
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 999999;
        font-size: 1.7rem;
        color: #fff;
        text-align: center;
        font-weight: 600;
      }
      .appFatalCrash * {
        user-select: text;
      }

      #news_article_content * {
        user-select: text;
        cursor: auto;
      }

      #news_article_content a {
        cursor: pointer !important;
      }

      #floating-root {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        right: var(--ad-column-width, 0px);
        overflow: clip;
        pointer-events: none;
        z-index: 10001;
      }

      #floating-root > * {
        pointer-events: auto;
      }
    </style>
    <title>GDLauncher Carbon</title>
    <script type="module">
      import { getBuiltinTheme } from "/src/themes/builtin.ts"
      import { applyResolvedTheme } from "/src/themes/apply.ts"

      window.scrollRestoration = "manual"

      const main = getBuiltinTheme("main")
      void applyResolvedTheme("main", main, main)
      // TODO: handle sourcemaps decoding + sentry
      if (!import.meta.env.DEV) {
        // These errors can be safely ignored.
        // https://github.com/w3c/csswg-drafts/issues/5488
        // https://github.com/DevExpress/testcafe/issues/4857#issuecomment-598775956
        const resizeObserverErrors = [
          /ResizeObserver loop limit exceeded/,
          /ResizeObserver loop completed with undelivered notifications\./
        ]

        window.onerror = (msg, url, line, col, error) => {
          if (resizeObserverErrors.some((re) => re.test(msg))) {
            return
          }

          console.log(
            "Handling global uncaught error",
            msg,
            url,
            line,
            col,
            error
          )
          window.fatalError(msg, url.split("/").slice(-3).join(" -> "))
          return true
        }
      }
    </script>
  </head>
  <body
    style="margin: 0; padding: 0; overflow: hidden; background: #1e2129"
    spellcheck="false"
  >
    <div
      id="overlay"
      style="
        height: 100vh;
        width: 100vw;
        position: absolute;
        z-index: 10000;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: none;
      "
    ></div>
    <div id="floating-root"></div>
    <div id="root"></div>
    <div id="appFatalCrash"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
