# Ignore unpublished workspace crates (carbon_*, prisma-cli, etc.)
private = { ignore = true }

# Use built-in workarounds for crates with known issues
workarounds = ["ring"]

# Ignore dev dependencies (test-only crates)
ignore-dev-dependencies = true

