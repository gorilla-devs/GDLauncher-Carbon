accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "NCSA",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BUSL-1.1",
]

# Ignore unpublished workspace crates (carbon_*, etc.)
private = { ignore = true }

# Use built-in workarounds for crates with known issues
workarounds = ["ring"]

# Ignore dev dependencies (test-only crates)
ignore-dev-dependencies = true

# ============================================================================
# CLARIFICATIONS FOR EXTERNAL CRATES WITHOUT LICENSE FIELDS
# ============================================================================

# fuchsia-cprng (BSD-3-Clause)
[fuchsia-cprng]
accepted = ["BSD-3-Clause"]
[fuchsia-cprng.clarify]
license = "BSD-3-Clause"

# display-info - fork without license field, MIT per original
[display-info]
accepted = ["MIT"]
[display-info.clarify]
license = "MIT"

# carbon_scheduler - GorillaDevs internal
[carbon_scheduler]
accepted = ["MIT"]
[carbon_scheduler.clarify]
license = "MIT"

# ============================================================================
# GDLAUNCHER INTERNAL CRATES (BUSL-1.1)
# These are part of the GDLauncher project itself
# ============================================================================

[carbon_app]
accepted = ["BUSL-1.1"]
[carbon_app.clarify]
license = "BUSL-1.1"

[carbon_compression]
accepted = ["BUSL-1.1"]
[carbon_compression.clarify]
license = "BUSL-1.1"

[carbon_macro]
accepted = ["BUSL-1.1"]
[carbon_macro.clarify]
license = "BUSL-1.1"

[carbon_net]
accepted = ["BUSL-1.1"]
[carbon_net.clarify]
license = "BUSL-1.1"

[carbon_parsing]
accepted = ["BUSL-1.1"]
[carbon_parsing.clarify]
license = "BUSL-1.1"

[carbon_platforms]
accepted = ["BUSL-1.1"]
[carbon_platforms.clarify]
license = "BUSL-1.1"

[carbon_repos]
accepted = ["BUSL-1.1"]
[carbon_repos.clarify]
license = "BUSL-1.1"

[carbon_rt_path]
accepted = ["BUSL-1.1"]
[carbon_rt_path.clarify]
license = "BUSL-1.1"
